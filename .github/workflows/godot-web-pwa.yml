name: NEYRO Web surfaces build and release

on:
  pull_request:
    paths:
      - "godot/**"
      - "phaser/**"
      - "phaser-preview/**"
      - "index.html"
      - "README.md"
      - ".github/workflows/godot-web-pwa.yml"
  push:
    branches: [main]
    paths:
      - "godot/**"
      - "phaser/**"
      - "phaser-preview/**"
      - "index.html"
      - "README.md"
      - ".github/workflows/godot-web-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  export-web-surfaces:
    name: Export Godot + canonical Phaser + legacy Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and audit canonical Phaser runtime
        working-directory: phaser
        run: |
          npm install --package-lock-only
          npm ci
          npm run typecheck
          npm run catalog:audit
          npm run build
          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js

      - name: Materialize pinned Vazirmatn font
        env:
          GOOGLE_FONTS_COMMIT: 6f9713a50c628d79f60259319d05fa0a239a9a7f
        run: |
          mkdir -p godot/assets/fonts
          curl -L --fail --retry 3 \
            -o godot/assets/fonts/Vazirmatn.ttf \
            "https://raw.githubusercontent.com/google/fonts/$GOOGLE_FONTS_COMMIT/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf"
          curl -L --fail --retry 3 \
            -o godot/assets/fonts/OFL.txt \
            "https://raw.githubusercontent.com/google/fonts/$GOOGLE_FONTS_COMMIT/ofl/vazirmatn/OFL.txt"
          test -s godot/assets/fonts/Vazirmatn.ttf
          test -s godot/assets/fonts/OFL.txt

      - name: Install Godot and official export templates
        env:
          GODOT_VERSION: 4.5-stable
        run: |
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v4.5-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.5-stable_linux.x86_64
          curl -L --fail --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v4.5-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.stable"
          unzip -q templates.tpz -d "$HOME/.local/share/godot/export_templates/4.5.stable"
          mv "$HOME/.local/share/godot/export_templates/4.5.stable/templates"/web_*.zip "$HOME/.local/share/godot/export_templates/4.5.stable/"

      - name: Validate Godot startup scripts
        run: |
          ./Godot_v4.5-stable_linux.x86_64 --headless --path godot --editor --quit > godot-validation.log 2>&1 || true
          ! grep -En "Parse Error|SCRIPT ERROR|Failed to load script|Invalid get index|Invalid set index" godot-validation.log
          test -f godot/.godot/global_script_class_cache.cfg
          test -f godot/.godot/imported/Vazirmatn.ttf-*.fontdata || find godot/.godot/imported -maxdepth 1 -type f -name 'Vazirmatn.ttf-*' | grep -q .

      - name: Export Godot Web/PWA build
        run: |
          mkdir -p godot/build/web
          ./Godot_v4.5-stable_linux.x86_64 --headless --path godot --export-release Web build/web/index.html
          test -f godot/build/web/index.html
          test -f godot/build/web/index.pck
          test "$(stat -c%s godot/build/web/index.pck)" -gt 100000

      - name: Publish standalone Web prototype beside Godot
        run: |
          mkdir -p godot/build/web/legacy
          cp index.html godot/build/web/legacy/index.html
          test -s godot/build/web/legacy/index.html

      - name: Publish canonical Phaser runtime
        run: |
          rm -rf godot/build/web/phaser
          mkdir -p godot/build/web/phaser
          cp -R phaser/dist/. godot/build/web/phaser/
          test -s godot/build/web/phaser/index.html

      - name: Publish compatibility NEYRO preview
        run: |
          rm -rf godot/build/web/phaser-preview
          mkdir -p godot/build/web/phaser-preview
          cp -R phaser-preview/. godot/build/web/phaser-preview/
          test -s godot/build/web/phaser-preview/index.html
          test -s godot/build/web/phaser-preview/game.js
          test -s godot/build/web/phaser-preview/styles.css
          grep -q 'صفحه بازی' godot/build/web/phaser-preview/index.html
          grep -Fq 'grid-template-columns:repeat(var(--n),1fr)' godot/build/web/phaser-preview/styles.css

      - name: Upload deployable Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: neyro-web-surfaces
          path: godot/build/web
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: godot/build/web

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: export-web-surfaces
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy NEYRO web surfaces
        id: deployment
        uses: actions/deploy-pages@v4
