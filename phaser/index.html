<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080d24" />
    <meta name="description" content="NEYRO — هزارتوی ذهن، بازی بین‌المللی منطق فضایی و شبکهٔ نور برای وب و موبایل" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>NEYRO | هزارتوی ذهن</title>
  </head>
  <body data-age="5-8" data-difficulty="easy">
    <main class="app-shell">
      <header class="hud" aria-label="وضعیت بازی">
        <div class="brand-row">
          <div>
            <div class="brand">NEYRO</div>
            <div class="tagline" id="tagline">هزارتوی ذهن · شبکهٔ نور</div>
          </div>
          <button id="localeButton" class="compact language-switch" type="button" aria-label="تغییر زبان">EN</button>
        </div>

        <section class="player-profile" aria-label="پروفایل بازی">
          <div class="profile-badges">
            <span id="ageBadge" class="profile-badge">سن ۵–۸</span>
            <span id="difficultyBadge" class="profile-badge">ساده</span>
            <span id="boardSizeLabel" class="profile-badge">شبکه ۵×۵</span>
          </div>
          <div class="profile-controls">
            <label><span id="ageText">رده سنی</span><select id="ageSelect"><option value="5-8">۵–۸</option><option value="9-17">۹–۱۷</option><option value="18+">۱۸+</option></select></label>
            <label><span id="difficultyText">سختی</span><select id="difficultySelect"><option value="easy">ساده</option><option value="medium">متوسط</option><option value="hard">سخت</option></select></label>
            <button id="loadButton" class="compact" type="button">اعمال</button>
          </div>
        </section>

        <section class="mission" aria-live="polite">
          <span class="mission-kicker">هدف مرحله</span>
          <strong id="statusLabel">قطعه‌ها را بچرخان و مسیر نور را کامل کن.</strong>
        </section>

        <div class="stats compact-stats" aria-label="آمار مرحله">
          <span id="stageLabel">مرحله ۱</span>
          <span id="movesLabel">حرکت: ۰</span>
          <span id="pulseLabel">پالس: ۰/۱</span>
          <span id="timerLabel">زمان: ۰۰:۰۰</span>
          <span id="bestTimeLabel">بهترین: —</span>
        </div>

        <div class="actions player-actions" aria-label="کنترل‌های بازی">
          <button id="pulseButton" class="primary">ارسال پالس</button>
          <button id="hintButton">راهنما −۲۵</button>
          <button id="undoButton">بازگشت</button>
          <button id="restartButton">شروع دوباره</button>
          <button id="nextButton">مرحله بعد</button>
        </div>

        <details class="advanced-panel">
          <summary>انتخاب فصل و مرحله</summary>
          <div class="selectors stage-selectors" aria-label="انتخاب مرحله">
            <label><span id="chapterText">فصل</span><select id="chapterSelect"></select></label>
            <label><span id="stageText">مرحله</span><input id="stageInput" type="number" min="1" max="1000" value="1" inputmode="numeric" /></label>
          </div>
        </details>
      </header>

      <section class="game-card" aria-label="صفحه بازی">
        <div id="game"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/player-adaptation.ts"></script>
  </body>
</html>
